[package]
name = "disktree"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "Düşük bellekli çevrimdışı disk analizörü: sabit bellekli tarama, squarified treemap, ısı haritası ve boyut zaman çizelgesi."
repository = "https://github.com/SyntaxOrigin/disktree"
readme = "README.md"
keywords = ["disk", "treemap", "cli", "storage", "analyzer"]
categories = ["command-line-utilities"]

[dependencies]
# serde: `Kayma` anlık görüntüsü ve `Rapor` çıktısı için türetilmiş veri yapıları gerekli (src/rapor.rs).
serde = { version = "1", features = ["derive"] }
# serde_json: anlık görüntü dosyası (`--cikti`) ve `report` JSON'u diske yazılıp ikinci çalıştırmada geri okunuyor.
serde_json = "1"
# clap: 7 alt komutlu (`scan`, `tree`, `treemap`, `timeline`, `heatmap`, `bigfiles`, `report`) CLI yüzeyi elle ayrıştırmaktan daha güvenilir.
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
